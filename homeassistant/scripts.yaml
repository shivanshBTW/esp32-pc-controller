# Append these three mappings to /config/scripts.yaml
# If that file is only `[]`, replace the file with this mapping (no leading dash list).

google_press_pc_power:
  alias: Press PC power
  icon: mdi:power
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.pc_controls
              state: "on"
          sequence:
            - service: rest_command.waketype_power_press
      default:
        - service: persistent_notification.create
          data:
            title: WakeType
            message: Turn on PC controls first. You then have 1 minute.

google_reset_the_pc:
  alias: Reset the PC
  icon: mdi:restart
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.pc_controls
              state: "on"
          sequence:
            - service: rest_command.waketype_reset
      default:
        - service: persistent_notification.create
          data:
            title: WakeType
            message: Turn on PC controls first. You then have 1 minute.

google_force_shut_down:
  alias: Force shut down
  icon: mdi:power-cycle
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.pc_controls
              state: "on"
          sequence:
            - service: rest_command.waketype_power_hold
      default:
        - service: persistent_notification.create
          data:
            title: WakeType
            message: Turn on PC controls first. You then have 1 minute.
