# google_assistant: !include google_assistant.yaml
#
# Routines: turn on Press PC power / Reset the PC / Force shut down.
# Devices tab: PC power is a door (open = PC on). Do not put it in a routine.

project_id: ha-shivansh
service_account: !include SERVICE_ACCOUNT.json
report_state: true
expose_by_default: true
exposed_domains:
  - switch
  - light
entity_config:
  switch.press_pc_power:
    room: Bedroom
  switch.reset_the_pc:
    room: Bedroom
  switch.force_shut_down:
    room: Bedroom
  cover.pc_power:
    expose: true
    name: PC power
    room: Bedroom
  binary_sensor.pc_power:
    expose: false
  script.google_press_pc_power:
    expose: false
  script.google_reset_the_pc:
    expose: false
  script.google_force_shut_down:
    expose: false
