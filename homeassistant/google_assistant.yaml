# google_assistant: !include google_assistant.yaml
#
# Google routines must "turn on" these switches. Do not use the PC power
# open/closed sensor in a routine — it is read-only.

project_id: ha-shivansh
service_account: !include SERVICE_ACCOUNT.json
report_state: true
expose_by_default: true
exposed_domains:
  - switch
  - light
entity_config:
  switch.press_pc_power:
    room: Bedroom
  switch.reset_the_pc:
    room: Bedroom
  switch.force_shut_down:
    room: Bedroom
  binary_sensor.pc_power:
    expose: true
    room: Bedroom
  script.google_press_pc_power:
    expose: false
  script.google_reset_the_pc:
    expose: false
  script.google_force_shut_down:
    expose: false
